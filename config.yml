baseURL: "https://pietro-dedola.github.io/"
title: "Pietro Dedola"
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
  tag: tags

# Top navigation, matching the structure of Wei Zhang's website.
menu:
  main:
    - name: Working Papers
      url: /working-papers/
      weight: 1
    - name: Work in Progress
      url: /work-in-progress/
      weight: 2
    - name: About Me
      url: /about-me/
      weight: 3

params:
  description: "Pietro Dedola is a Ph.D. student in Economics at Princeton University."
  author: "Pietro Dedola"
  DateFormat: "January 2006"
  defaultTheme: light
  hideFooter: false
  disableThemeToggle: true
  ShowShareButtons: false
  ShowReadingTime: false
  disableSpecial1stPost: true
  disableAnchoredHeadings: true
  ShowPostNavLinks: false
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowAllPagesInArchive: false
  MainSections: []
  ShowToc: false
  disableScrollToTop: true
  TocOpen: true
  ShowWordCount: false
  UseHugoToc: true
  comments: false
  math: true

  profileMode:
    enabled: true
    title: "Pietro Dedola"
    subtitle: "Welcome to my website! I am a Ph.D. student in Economics at Princeton University. <br><br> My research interests include **decision theory**, **econometrics**, and **statistical learning**."
    # When you upload a headshot to static/photo_square.png, uncomment these:
    # imageUrl: "/photo_square.png"
    # imageWidth: 200
    # imageHeight: 200
    # imageTitle: "Pietro Dedola"
    buttons:
      - name: Working Papers
        url: /working-papers/
      - name: Work in Progress
        url: /work-in-progress/
      - name: About Me
        url: /about-me/

  # Only the three icons requested (no GitHub, no Teaching).
  socialIcons:
    - name: CV
      url: /cv.pdf
    - name: Email
      url: "mailto:pdedola@princeton.edu"
    - name: LinkedIn
      url: "https://it.linkedin.com/in/pietro-dedola-65226b296"

  assets:
    disableScrollBarStyle: true
  cover:
    hiddenInList: false
    hiddenInSingle: true
  label:
    text: "Pietro Dedola"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    guessSyntax: true
    style: autumn
  tableOfContents:
    endLevel: 2
    ordered: false
    startLevel: 2
